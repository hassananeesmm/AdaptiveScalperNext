name: CI

# Full offline suite on every push to main and every pull request (2026-10-09
# audit: the only other workflow ran on one stale branch, so main and its PRs
# had no CI). MetaTrader5 is never reached: tests/conftest.py blocks the live
# terminal and ASN_DISABLE_MT5 keeps the gateway offline.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-python313:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ASN_DISABLE_MT5: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        shell: pwsh
        run: python -m compileall -q adaptive_scalper

      - name: Safety-critical tests first
        shell: pwsh
        run: python -m pytest -q tests/test_peak_equity.py tests/test_risk_governor.py tests/test_final_permission.py tests/test_execution_service.py tests/test_runtime_architecture.py tests/test_v1_strategy_freeze.py

      - name: Full suite
        shell: pwsh
        run: python -m pytest -q
