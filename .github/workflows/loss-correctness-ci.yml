name: Temporary loss-correctness CI

on:
  push:
    branches:
      - fix/v1-loss-root-cause-correctness

permissions:
  contents: read

jobs:
  python313:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ASN_DISABLE_MT5: "1"
      CLAUDE_PROJECT_DIR: 'C:\AdaptiveScalperNext'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        shell: pwsh
        run: python -m compileall -q adaptive_scalper
      - name: Focused correctness tests
        shell: pwsh
        run: python -m pytest -q tests/test_cost_model.py tests/test_cost_edge.py tests/test_runtime_cost_semantics.py tests/test_runtime.py
      - name: Full suite
        shell: pwsh
        run: python -m pytest -q
