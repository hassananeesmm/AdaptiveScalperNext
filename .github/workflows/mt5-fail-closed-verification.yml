name: MT5 fail-closed verification

on:
  push:
    branches:
      - fix/mt5-broker-truth-fail-closed-20260928

permissions:
  contents: read

jobs:
  windows-python313:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ASN_DISABLE_MT5: "1"
      CLAUDE_PROJECT_DIR: 'C:\AdaptiveScalperNext'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        shell: pwsh
        run: python -m compileall -q adaptive_scalper

      - name: Focused gateway tests
        shell: pwsh
        run: python -m pytest -q tests/test_mt5_request_builder.py tests/test_broker_chaos.py tests/test_execution_service.py tests/test_execution_reconciliation.py tests/test_runtime.py tests/test_runtime_restart.py

      - name: Full suite
        shell: pwsh
        run: python -m pytest -q
