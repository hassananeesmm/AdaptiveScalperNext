name: P0 verification

on:
  push:
    branches:
      - fix/paper-pending-entry-persistence-20260928
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-python313:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        shell: pwsh
        run: python -m compileall .

      - name: Focused P0 suites
        shell: pwsh
        run: |
          python -m pytest tests/test_backtest_engine.py tests/test_paper_state.py tests/test_paper_engine.py tests/test_persistence.py tests/test_migration_parser.py

      - name: Full test suite
        shell: pwsh
        run: python -m pytest
