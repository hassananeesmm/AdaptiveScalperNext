# Adaptive Scalper Next â€” default configuration.
#
# Hard safety sections (mode, market.symbols, strategies.retired, risk,
# news.fail_closed) are validated by adaptive_scalper.config.loader and
# fail startup if unsafe. See MASTER_BUILD_DIRECTIVE.md section 114.

mode = "PAPER"

[market]
# GBPJPY excluded (operator decision, 2026-09-26): execution-cost/slippage
# evidence remains insufficient (ASN-007). market.symbols accepts any
# non-empty subset of the canonical allow-list, so this narrows the
# executable set without touching any other safety gate. Re-add once real
# slippage evidence exists; never lower the cost-evidence standard instead.
symbols = ["XAUUSD", "BTCUSD"]

[strategies]
retired = ["failed_breakout_fade", "support_resistance_reaction"]

[risk]
risk_per_trade_pct = 0.25
max_total_open_risk_pct = 0.75
max_daily_loss_pct = 2.00
max_drawdown_pct = 5.00
max_open_positions = 2
max_positions_per_symbol = 1

[news]
primary_provider = "financecalendar"
secondary_provider = "forexfactory"
pre_high_impact_minutes = 15
post_high_impact_minutes = 30
fail_closed = true

[database]
path = "data/adaptive_scalper.sqlite3"

[mt5]
# Broker server clock (BUG_BACKLOG #14). IC Markets DEMO measured on the laptop
# 2026-09-24: tick.time = UTC+3 while US DST was in effect -> "UTC+2/US_DST"
# (UTC+2, UTC+3 during US DST; New York + 7 h). The winter (UTC+2) half is the
# broker's documented convention, not yet observed here: startup re-checks the
# rule against a live quote and refuses to start if a quote proves it wrong.
# Use "UTC" for a broker whose server clock is UTC.
server_time_rule = "UTC+2/US_DST"
# ASN-010: pin the terminal on a computer with several MT5 installations (the
# gateway refuses a terminal whose install folder differs). Example:
# terminal_path = 'C:\Program Files\MetaTrader 5 IC Markets Global\terminal64.exe'   # TOML literal string (single quotes)
# Pinned 2026-09-28: this laptop has two installs ("MetaTrader 5" and "MetaTrader 5
# IC Markets Global"); the IC Markets one is attached to the ICMarketsSC-Demo account
# (verified read-only: terminal_info().path, trade_mode=DEMO).
terminal_path = 'C:\Program Files\MetaTrader 5 IC Markets Global\terminal64.exe'

[runtime]
# Directive section 16 cadences. Position reviews always run at least as
# often as entry scans.
entry_resolution = "M5"
position_cycle_seconds = 1.0
entry_cycle_seconds = 4.0
heartbeat_seconds = 1.0
news_refresh_seconds = 1200
news_stale_after_seconds = 7200
bar_history_count = 300
paper_initial_equity = 10000.0
paper_session_tag = "v2"
magic = 240924
log_dir = "logs"

# Per-symbol execution-cost evidence. Leave a value out when it is not
# KNOWN: DEMO then blocks new entries for that symbol (BLOCK_COST) and
# PAPER labels its results UNVERIFIED_ASSUMPTION. Fill these from the
# broker's contract specification (provenance = "BROKER_SPEC_ESTIMATE")
# or from measured DEMO fills ("BROKER_DEMO_CONFIRMED") -- see
# LOCAL_MT5_HANDOFF.md. slippage_price is PER FILL, not round trip; the
# pre-entry runtime cost gate charges it twice (entry + expected exit), while
# an already-open position review charges only the remaining exit fill.
#
# Evidence (2026-09-25): the ICMarketsSC-Demo account's own imported history,
# 2,222 deals 2026-09-11..18 (`broker_account_deals` / `broker_account_orders`).
# Commission = sum(commission) / sum(volume) per side, x2. Slippage = the p90 of
# adverse (fill - requested price) on market orders -- conservative, not fitted.
# Swap 0.0: every measured position was intraday (swap 0 on all deals).
[costs.XAUUSD]
# 212 round trips, 31.79 lots: 3.514 USD/lot/side. Slippage n=196: median 0.03, p90 0.41.
commission_per_lot_round_trip = 7.03
slippage_price = 0.41
provenance = "BROKER_DEMO_CONFIRMED"

[costs.GBPJPY]
# 7 round trips, 5.07 lots: 3.501 USD/lot/side. Slippage: only n=7 samples -- too
# few to trust, so it stays UNKNOWN and DEMO entries block with BLOCK_COST until
# real fills accumulate (`costs observed --symbol GBPJPY`).
commission_per_lot_round_trip = 7.00
provenance = "UNVERIFIED_ASSUMPTION"

[costs.BTCUSD]
# 159 round trips, 73.5 lots: commission 0.00. Slippage n=141: median 0.41, p90 11.97.
commission_per_lot_round_trip = 0.0
slippage_price = 11.97
provenance = "BROKER_DEMO_CONFIRMED"
