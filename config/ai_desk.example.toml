# AI Trading Desk configuration (copy to config/ai_desk.toml to use).
# ADVISORY ONLY: the desk has no execution authority. Disabled and offline by default.
# Secrets are NEVER stored here - only the NAME of an environment variable that holds a key.

enabled = false                     # set to true to let `ai-desk serve` / START AI DESK.bat run
journal_path = "data/ai_desk.sqlite3"
trading_config_path = "config/default.toml"
symbols = ["XAUUSD", "BTCUSD", "GBPJPY"]
market_resolution = "M5"
poll_seconds = 15.0
agent_timeout_seconds = 60.0
stale_after_seconds = 1800
runtime_state_stale_seconds = 120
retention_days = 90
cache_ttl_seconds = 3600

provider = "deterministic"          # deterministic = real Python analysis, no network, no cost
fallback_providers = []
llm_agents = ["coordinator"]        # agents that may get an (untrusted) narrative when a model is configured
allowed_external_data = []          # e.g. ["risk_summary", "market_features"]; empty = nothing leaves the machine

[budget]
daily_token_budget = 0              # 0 = no external tokens
daily_cost_budget_usd = 0.0         # 0 = no paid calls

[intervals]
market_analyst = 300.0
strategy_analyst = 3600.0
news_analyst = 900.0
risk_analyst = 120.0
learning_analyst = 3600.0
scheduled_report = 3600.0

[[providers]]
name = "deterministic"
kind = "deterministic"

