[project]
name = "adaptive-scalper-next"
version = "0.0.1"
description = "PAPER + MT5 DEMO adaptive scalping research and execution platform"
# Canonical project interpreter is C:\AdaptiveScalperNext\.venv\Scripts\python.exe,
# built against 3.13 (directive section 113). Pinned <3.14 deliberately —
# do not run this project's runtime against the machine's global Python
# 3.14 install; it is untested here and not the canonical interpreter.
requires-python = ">=3.13,<3.14"

# Pytest config lives in pytest.ini (CLAUDE.md's documented canonical
# location) — a [tool.pytest.ini_options] section here would be silently
# ignored in favor of it (pytest warns about the conflict), so it's
# deliberately not duplicated.

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses with immutable fields only: safe to construct once as
# argument defaults.
extend-immutable-calls = [
    "adaptive_scalper.backtest.types.BacktestConfig",
    "adaptive_scalper.position_management.adaptive_exit.AdaptiveExitParams",
    "adaptive_scalper.position_management.re_entry.ReentryParams",
]

[tool.ruff.lint.per-file-ignores]
# V1 decision sources are byte-frozen: tests/test_v1_strategy_freeze.py pins
# their SHA-256, so import re-sorting must never touch them. Only I001 is
# waived; every other rule still applies.
"adaptive_scalper/selector/selector.py" = ["I001"]
"adaptive_scalper/strategies/__init__.py" = ["I001"]
"adaptive_scalper/strategies/microstructure_acceleration.py" = ["I001"]
"adaptive_scalper/strategies/momentum_continuation.py" = ["I001"]
"adaptive_scalper/strategies/pullback_continuation.py" = ["I001"]
"adaptive_scalper/strategies/volatility_expansion.py" = ["I001"]
